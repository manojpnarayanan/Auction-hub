version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: auction_backend
    restart: always 
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - auction_network

  redis:
    image: redis:alpine
    container_name: auction_redis
    restart: always
    ports:
      - "6379:6379" 
    networks:
      - auction_network

networks:
  auction_network:
    driver: bridge
